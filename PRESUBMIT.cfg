[Hook Scripts]
cros_format: bash -c 'cros format --check --exclude "testdata/**.json" --exclude "testdata/**.xml" --exclude devtools/vscode/settings.json --commit ${PRESUBMIT_COMMIT} ${PRESUBMIT_FILES}'
pylint: bash -c './scripts/run_pylint.sh ${PRESUBMIT_FILES}'
mypy: bash -c './scripts/run_mypy.sh ${PRESUBMIT_FILES}'
dry_run_commands: ./scripts/dry_run_commands.sh

# pytest doesn't run on the local presubmit, since it takes time and hits timeout.
pytest: bash -c 'if [[ "${USER}" == "chrome-bot" ]]; then ./scripts/run_pytest.sh; else exit 0; fi'

[Hook Overrides]
exec_files_check: true
