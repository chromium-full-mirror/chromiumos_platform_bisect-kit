[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--log-level=DEBUG",
    "--quiet",
    "--numprocesses=auto",
    "--maxprocesses=16",
    "--durations=5",
]
norecursedirs = [
    "third_party",
    "venv",
]
