[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bisect_kit*"]

[project]
name = "bisect_kit"
version = "0.1.0"
description = "ChromeOS bisect kit"
requires-python = ">=3.10, <3.14"
dependencies = [
    "google-api-python-client",
    "google-cloud-compute",
    "google-cloud-datastore",
    "google-genai==2.6.0",
    "googleapis_common_protos",
    "protobuf<5.0.0",
    "psutil",
    "pyopenssl",
    "scipy",
    "sshconf==0.2.5",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pylint==4.0.6",
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "mypy>=1.19.1",
]

[tool.black]
line-length = 80
target-version = ["py310", "py311", "py312", "py313"]
skip-string-normalization = true
exclude = """
/(
    | third_party
    | internal
    | venv
    | \\.venv
)/
"""

[tool.isort]
profile = "black"
line_length = 80
lines_after_imports = 2
skip_glob = [
    "third_party/*",
    "internal/*",
    "venv/*",
    ".venv/*",
]
extend_skip_glob = [
    "*_pb2.py",
]
length_sort = false
force_single_line = true
from_first = false
case_sensitive = false
force_sort_within_sections = true
order_by_type = false

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["."]
python_files = ["*_test.py"]
addopts = [
    "--log-level=DEBUG",
    "--durations=5",
]
norecursedirs = [
    "third_party",
    "internal",
    "venv",
    ".venv",
]

[tool.coverage.run]
source = ["bisect_kit"]
disable_warnings = [
    "couldnt-parse",
]
omit = [
    "third_party/*",
    "internal/*",
    "venv/*",
    ".venv/*",
    "*_pb2.py",
    "*_test.py",
]

[tool.pylint.main]
source-roots = [".", "third_party"]
ignore-paths = [
    ".*_pb2\\.py$",
    ".*third_party/.*",
    ".*internal/.*",
    ".*venv/.*",
]

[tool.pylint.messages_control]
disable = [
    "broad-except", # TODO(acewu): except them by comments if necessary
    "consider-using-f-string",
    "consider-using-with", # TODO(acewu): except them by comments if necessary
    "duplicate-code",
    "fixme",
    "invalid-name",
    "line-too-long", # let black handle it
    "missing-function-docstring",
    "missing-module-docstring",
    "no-member",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    # our code contains a lot of existing functions with many arguments.
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-statements",
    "ungrouped-imports", # let isort handle it
    "unspecified-encoding",
    "wrong-import-order", # let isort handle it
]

[tool.pyright]
exclude = [
    "venv",
    ".venv",
    "third_party",
    "internal",
]
venvPath = "."
venv = "venv"
extraPaths = [
    "third_party",
]

[tool.pyright.analysis]
typeCheckingMode = "strict"

[tool.mypy]
exclude = "(^third_party/|^internal/|^venv/|^\\.venv/)"
show_error_codes = true
check_untyped_defs = true
ignore_missing_imports = true

# TODO: Enable strict checking.
strict = false

# TODO: Enable the suppressed errors.
disable_error_code = [
    "arg-type",
    "call-arg",
    "return-value",
    "union-attr",
]
